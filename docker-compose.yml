name: cdc-oracle

services:
  # ---------------------------------------------------------------------
  # Oracle XE 21c - the CDC source
  # ---------------------------------------------------------------------
  # CDB = XE, PDB = XEPDB1. The -faststart variant ships with the database
  # already created, so the first boot is seconds rather than minutes.
  #
  # Note: this image has NO ENABLE_ARCHIVELOG env var - that only exists on
  # the newer gvenzl/oracle-free images. ARCHIVELOG is enabled instead by
  # oracle-init/01_enable_archivelog.sql, which the image's entrypoint runs
  # from /container-entrypoint-startdb.d on every start (idempotent).
  #
  # Because the faststart image already contains a database, the entrypoint
  # treats every start as "already initialized" and never runs
  # /container-entrypoint-initdb.d - startdb.d is the only usable hook.
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: cdc-oracle
    environment:
      ORACLE_PASSWORD: oracle          # SYS / SYSTEM password
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle-init:/container-entrypoint-startdb.d:ro
      - ./:/scripts:ro                 # so setup.ps1 can run the .sql files in-container
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # ---------------------------------------------------------------------
  # Kafka 3.8 - single node, KRaft (no ZooKeeper)
  # ---------------------------------------------------------------------
  # Two plaintext listeners: PLAINTEXT for containers on this network,
  # EXTERNAL for tools on the host (localhost:29092).
  kafka:
    image: apache/kafka:3.8.0
    container_name: cdc-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: cdc-oracle-cluster-1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------------
  # Kafka Connect (Debezium) - hosts the Oracle connector
  # ---------------------------------------------------------------------
  # Verified: this image already contains /kafka/connect/debezium-connector-oracle
  # *including* ojdbc8 and orai18n, so no custom Dockerfile / driver download
  # is needed. See README.md ("Image verification").
  connect:
    image: quay.io/debezium/connect:3.6.0.Final
    container_name: cdc-connect
    depends_on:
      kafka:
        condition: service_healthy
      oracle:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: cdc-oracle
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_TOPIC_CREATION_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------
  # RisingWave - streaming SQL engine, reads the Kafka topic directly
  # ---------------------------------------------------------------------
  # single_node mode runs meta/compute/frontend/compactor in one process -
  # fine for a lab, not for production. Speaks the Postgres wire protocol
  # on 4566, so any Postgres client (psql, DBeaver, etc.) can query it.
  risingwave:
    image: risingwavelabs/risingwave:v2.0.5
    container_name: cdc-risingwave
    command: single_node
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "4566:4566"    # Postgres-wire SQL port
      - "5691:5691"    # meta HTTP dashboard
    environment:
      RW_SINGLE_NODE_STORE_DIRECTORY: /risingwave/data
    volumes:
      - risingwave-data:/risingwave/data

volumes:
  oracle-data:
  kafka-data:
  risingwave-data:
